[config]
;本地IP地址
LOCALIP=0.0.0.0:23333

;心跳间隔(单位：毫秒)
HEARTBEAT_INTERVAL_TIME=1000

;最大心跳无反馈次数
HEARTBEAT_MAX_FAIL_NUM=3

;发送数据时是否发送心跳,不推荐修改
HEARTBEAT_IGNORE_SEND=1

;加入会话的超时值(单位：秒)
JOINSESSION_TIMEOUT=3

;定时自动连接时间间隔(单位：秒)
CONNECT_TIME=2

;定时自动重连时间间隔(单位：秒)
RECONNECT_TIME=1

;定时申请主备裁决时间间隔(单位：秒)
SEARCHSERVER_TIME=1

;是否为代理DNS,1表示是代理DNS,使用域服务器上的DNS进行域名解析，0表示用本地的DNS进行解析
PROXYDNS=0

;流程图在线调试，连接VH域服务器的操作域名和DNS端口
VH_OA_NAME=OA
VH_DNS_PORT=18314

;显示主服务信息
UPDATE_SERVERINFO=1
DNSNUM=1
DNSNAME1=OA0
OA0NUM=1
OA0IPNUM=1
