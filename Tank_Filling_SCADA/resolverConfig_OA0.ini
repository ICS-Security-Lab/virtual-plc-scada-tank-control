[config]
;0:非调试模式，所有配置从组态读取
;1:调试模式，所有配置都从本配置文件读取
DEBUG=1

;0：点击关闭直接退出 1：点击关闭不退出
ClOSETYPE=0

;本地IP地址
LOCALIP=0.0.0.0:23333

;心跳间隔(单位：毫秒)
HEARTBEAT_INTERVAL_TIME=2000

;最大心跳无反馈次数
HEARTBEAT_MAX_FAIL_NUM=3

;发送数据时是否发送心跳,不推荐修改
HEARTBEAT_IGNORE_SEND=1

;加入会话的超时值(单位：秒)
JOINSESSION_TIMEOUT=3

;定时自动连接时间间隔(单位：秒)
CONNECT_TIME=2

;定时自动重连时间间隔(单位：秒)
RECONNECT_TIME=1

;定时申请主备裁决时间间隔(单位：秒)
SEARCHSERVER_TIME=1

DNSNUM=1
DNSNAME1=OA0
OA0NUM=1
OA0IPNUM=1
OA0_1IP1=127.0.0.1:22222
